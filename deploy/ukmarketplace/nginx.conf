# /etc/nginx/sites-available/ukmarketplace.itwing.cloud
# Admin/vendor web portal (static) + API, Socket.IO and uploads proxied to
# the api container on 127.0.0.1:8050. certbot adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name ukmarketplace.itwing.cloud;

    root /var/www/ukmarketplace.itwing.cloud;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8050;
    }

    # Hashed build assets can be cached for long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes (/admin/..., /vendor/..., /store/:slug)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
